<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Sessão compartilhada · NarraHub</title>
    <link rel="stylesheet" href="/viewer.css" />
    <script type="module" src="/viewer.js"></script>
  </head>
  <body>
    <section id="loading" class="state"><span></span><h1>Abrindo sessão protegida…</h1><p>A chave permanece somente neste navegador.</p></section>
    <section id="error" class="state" hidden><div class="mark">N</div><h1>Não foi possível abrir esta sessão</h1><p id="error-message"></p></section>
    <div id="workspace" class="workspace" hidden>
      <header class="topbar"><div class="brand"><span class="mark">N</span><strong>NarraHub</strong></div><div class="session-title"><b id="title"></b><small id="expiry"></small></div><div class="top-actions"><span id="permission" class="permission"></span><button id="conversation-button" type="button" class="icon-button">Anotações <b id="conversation-count">0</b></button></div></header>
      <aside class="sidebar"><p class="eyebrow">UNIVERSOS</p><nav id="universe-nav"></nav><div class="sidebar-rule"></div><nav id="section-nav" class="section-nav"></nav><footer>Conteúdo descriptografado neste dispositivo.</footer></aside>
      <main id="main" class="main"></main>
      <aside id="conversation" class="conversation" aria-label="Conversa da sessão"><header><div><span class="eyebrow">CONVERSA</span><h2>Anotações por seção</h2></div><button id="conversation-close" type="button" class="icon-button" aria-label="Fechar">×</button></header><div class="identity"><label>Seu nome<input id="contributor-name" maxlength="60" placeholder="Como deseja aparecer" /></label></div><div id="conversation-feed" class="conversation-feed"></div></aside>
    </div>
    <dialog id="entity-dialog" class="sheet"><div id="entity-dialog-content"></div></dialog>
    <dialog id="editor-dialog" class="sheet editor-sheet"><div id="editor-dialog-content"></div></dialog>
  </body>
</html>
