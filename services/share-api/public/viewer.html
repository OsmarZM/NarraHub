<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Conteúdo compartilhado · NarraHub</title>
    <link rel="stylesheet" href="/viewer.css" />
    <script type="module" src="/viewer.js"></script>
  </head>
  <body>
    <header class="site-header"><span class="mark">N</span><strong>NarraHub</strong><small>Sessão temporária de leitura</small></header>
    <main>
      <section id="loading" class="state"><span></span><h1>Abrindo conteúdo protegido…</h1><p>A chave permanece no seu navegador.</p></section>
      <section id="error" class="state" hidden><h1>Não foi possível abrir este conteúdo</h1><p id="error-message"></p></section>
      <article id="document" hidden>
        <p class="eyebrow">CONTEÚDO COMPARTILHADO</p>
        <h1 id="title"></h1>
        <p id="context" class="context"></p>
        <div class="rule"></div>
        <div id="content" class="content"></div>
        <footer><span>Conteúdo descriptografado somente neste navegador.</span><time id="expiry"></time></footer>
      </article>
    </main>
  </body>
</html>
