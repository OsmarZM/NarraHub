[package]
name = "narrahub"
version = "0.9.2"
description = "NarraHub - Workspace Local-First para Construir Universos Narrativos"
authors = ["FortaTech"]
edition = "2021"

[lib]
name = "narrahub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
snow = "0.9"
spake2 = "0.4"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sysinfo = "0.37"
zip = { version = "4", default-features = false, features = ["deflate"] }
# Reescrita estrutural de HTML (ADR 0010, NH-065). `chapters.content` guarda
# HTML, nao JSON do Tiptap, e a transformacao de <img src="data:..."> para
# referencia de blob precisa ser estrutural. Este crate existe para reescrever
# um atributo e repassar todo o resto verbatim, que e a garantia de preservar
# atributo desconhecido e o HTML ao redor.
lol_html = "3.0.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
incremental = true
debug = 1 # Gera tabelas de linhas em vez de símbolos de debug pesados, acelerando o link.exe em até 75%

