name: CI

# O workflow de release roda só por `workflow_dispatch`, então até aqui nenhum
# Pull Request era validado pelo GitHub: os commits diziam que o build e os
# testes passaram localmente, e não havia como conferir. Este workflow existe
# para o "All checks have passed" significar alguma coisa.
on:
  pull_request:
  push:
    branches: [main, feat/native-app-foundation]

# Um PR que recebe vários pushes seguidos não precisa terminar as execuções
# antigas — só a do último commit diz algo sobre o que será mesclado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A versao e um fato unico do repositorio: manifests, README e CHANGELOG.
      # Ficava so na pipeline de release, e por isso o README anunciou 0.7.4
      # durante tres releases sem ninguem reprovar nada.
      - run: npm run release:validate-version
      - run: npm run build
      - run: npm run test:architecture
      - run: npm run test:planning
      - run: npm run test:ai
      - run: npm run share-api:test

  rust:
    name: Core Rust
    # Ubuntu porque o core não depende de nada de Windows: ele fala rusqlite e
    # SQLite. O empacotamento do instalador continua sendo Windows, no workflow
    # de release. Rodar aqui em Linux é o que mantém o CI barato e rápido.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # O crate depende do Tauri, que precisa das bibliotecas de sistema do
      # GTK/WebKit mesmo quando só se compila a biblioteca e os testes.
      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    name: Android
    # A etapa 14 e Windows <-> Android, e ate aqui nenhuma pipeline tinha
    # construido nada para Android -- entao "funciona no Android" era
    # afirmacao, nao fato. Quando este job nasceu, o alvo NAO compilava: a
    # capability pedia `updater:default` numa plataforma onde o plugin do
    # updater nao existe, e o build script do Tauri parava antes de verificar
    # qualquer tipo. Sem job, isso teria sido descoberto num aparelho.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      # O Gradle do Android Gradle Plugin exige JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # `aws-lc-sys` (via reqwest -> rustls -> aws-lc-rs) compila C para o alvo,
      # e precisa do clang do NDK no PATH. O runner ja tras o NDK; o que falta
      # e apontar `NDK_HOME` para ele.
      - name: NDK do runner
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      # O `frontendDist` da configuracao aponta para `dist/narrahub-app/browser`,
      # que so existe depois do build do Angular.
      - run: npm run build
      - name: Verificacao do core para aarch64-linux-android
        run: |
          export PATH="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cargo clippy --manifest-path src-tauri/Cargo.toml --lib \
            --target aarch64-linux-android -- -D warnings
      # O gate de verdade: um APK. `cargo check` cru nao passa pelo Gradle, pelo
      # manifest, nem pelas capabilities resolvidas por plataforma -- que foi
      # exatamente onde o alvo estava quebrado.
      - name: APK de debug
        run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: narrahub-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
