name: CI

# O workflow de release roda só por `workflow_dispatch`, então até aqui nenhum
# Pull Request era validado pelo GitHub: os commits diziam que o build e os
# testes passaram localmente, e não havia como conferir. Este workflow existe
# para o "All checks have passed" significar alguma coisa.
on:
  pull_request:
  push:
    branches: [main, feat/native-app-foundation]

# Um PR que recebe vários pushes seguidos não precisa terminar as execuções
# antigas — só a do último commit diz algo sobre o que será mesclado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:architecture
      - run: npm run test:planning
      - run: npm run test:ai
      - run: npm run share-api:test

  rust:
    name: Core Rust
    # Ubuntu porque o core não depende de nada de Windows: ele fala rusqlite e
    # SQLite. O empacotamento do instalador continua sendo Windows, no workflow
    # de release. Rodar aqui em Linux é o que mantém o CI barato e rápido.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # O crate depende do Tauri, que precisa das bibliotecas de sistema do
      # GTK/WebKit mesmo quando só se compila a biblioteca e os testes.
      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
